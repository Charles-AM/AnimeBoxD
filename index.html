    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://animeboxd.app/#website",
            "url": "https://animeboxd.app/",
            "name": "AnimeBoxD",
            "description": "A free anime, manga and manhwa tracker with daily recommendations.",
            "inLanguage": "en"
          },
          {
            "@type": "WebApplication",
            "@id": "https://animeboxd.app/#app",
            "name": "AnimeBoxD",
            "url": "https://animeboxd.app/",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "image": "https://animeboxd.app/og-image.jpg",
            "description": "Track what you watch and read, rate and review titles, and get a daily pick for what to watch tonight.",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
            "isPartOf": { "@id": "https://animeboxd.app/#website" }
          }
        ]
      }
    </script>
    <!-- Apply saved theme instantly before React mounts to prevent flash of wrong theme -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("animeboxd_data_v1");
          var theme = raw ? (JSON.parse(raw).settings || {}).theme : null;
          if (!theme) theme = "Dark";
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = theme === "Dark" || (theme === "System" && prefersDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
